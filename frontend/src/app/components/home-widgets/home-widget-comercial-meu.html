<section class="home-widget" aria-label="Meu desempenho">
  <div class="home-widget-head">
    <div class="home-widget-head-title">
      <h2 class="home-section-title">Meu desempenho</h2>
      <div
        class="home-competencia-nav"
        role="group"
        aria-label="Navegar competência">
        <button
          type="button"
          class="btn btn-sm btn-primary home-competencia-nav-btn"
          title="Mês anterior"
          aria-label="Mês anterior"
          [disabled]="cardCarregando || !podeMesAnterior"
          (click)="navegarMesAnterior()">
          <i class="fas fa-chevron-left" aria-hidden="true"></i>
        </button>
        <p class="home-dashboard-competencia">
          {{ cardCompetencia || '—' }}
        </p>
        <button
          type="button"
          class="btn btn-sm btn-primary home-competencia-nav-btn"
          title="Próximo mês"
          aria-label="Próximo mês"
          [disabled]="cardCarregando || !podeMesProximo"
          (click)="navegarMesProximo()">
          <i class="fas fa-chevron-right" aria-hidden="true"></i>
        </button>
      </div>
      <button
        type="button"
        class="btn btn-sm home-widget-btn-atualizar"
        (click)="atualizar()"
        [disabled]="cardCarregando"
        title="Atualizar desempenho"
        aria-label="Atualizar meu desempenho">
        <i class="fas fa-sync-alt" [class.fa-spin]="cardCarregando" aria-hidden="true"></i>
      </button>
    </div>
  </div>
  @if (cardErro && !cardItem && !cardCarregando) {
    <p class="home-dashboard-status is-aviso">{{ cardErro }}</p>
  } @else if (cardItem) {
    <app-comercial-vendedor-card
      [item]="cardItem"
      [podeVerComissao]="podeVerComissao"
      [mostrarAcompanhamento]="podeAbrirAcompanhamento"
      [mostrarUltimoCaixa]="true"
      [competencia]="cardCompetencia"
      [anoMes]="cardAnoMes"
      [unidade]="cardUnidade"
    />
  }
</section>
