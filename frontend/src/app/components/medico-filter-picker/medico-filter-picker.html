<div class="medico-filter-picker">
  <div
    class="filter-entity-card filter-entity-clickable"
    *ngIf="opcoes.length || loading"
    title="Clique para abrir seleção de médicos"
    (click)="abrirModal($event)">
    <div class="filter-entity-top">
      <label class="filter-entity-title">
        <i class="fas fa-user-md filter-title-icon"></i>
        Médico ({{ medicoResumo }})
        <i class="fas fa-filter filter-open-icon"></i>
      </label>
      <div class="filter-section-actions filter-entity-actions">
        <button
          type="button"
          class="btn-filter-action btn-filter-muted btn-filter-icon-only"
          title="Remove todos os médicos selecionados do filtro"
          aria-label="Limpar médicos"
          (click)="limparSelecionados($event)">
          <i class="fas fa-trash-alt"></i>
        </button>
      </div>
    </div>
    <div
      class="selected-names-list"
      *ngIf="exibirNomesSelecionados && opcoes.length && medicosSelecionadosLista.length; else medicoResumoHint">
      <span
        class="selected-name-chip"
        *ngFor="let nome of medicosSelecionadosLista; trackBy: trackByNome">
        {{ nome }}
      </span>
    </div>
    <ng-template #medicoResumoHint>
      <span class="filter-empty-hint" *ngIf="opcoes.length && selectedMedicos.size === 0">
        {{ hintTodos }}
      </span>
    </ng-template>
    <span class="filter-empty-hint" *ngIf="loading && !opcoes.length">
      Carregando opções...
    </span>
  </div>

  <div
    #modalBackdrop
    class="medico-filter-picker-backdrop"
    *ngIf="modalOpen">
    <section class="picker-modal" (click)="$event.stopPropagation()">
      <header class="picker-modal-header">
        <h3 class="picker-modal-title">
          <i class="fas fa-user-md picker-modal-title-icon" aria-hidden="true"></i>
          Selecionar médicos
        </h3>
      </header>
      <div class="picker-modal-body">
        <div class="picker-modal-controls">
          <input
            type="text"
            class="form-control filter-search"
            placeholder="Buscar médico..."
            [(ngModel)]="buscaModal"
            autocomplete="off"
            aria-label="Buscar médico" />
        </div>

        <div class="picker-selected-section" *ngIf="rascunhoLista.length">
          <div class="picker-selected-header">
            Selecionados ({{ rascunhoLista.length }})
          </div>
          <div class="picker-selected-chips">
            <span
              class="picker-selected-chip"
              *ngFor="let nome of rascunhoLista; trackBy: trackByNome">
              <span class="picker-selected-chip-label" [title]="nome">{{ nome }}</span>
              <button
                type="button"
                class="picker-selected-chip-remove"
                title="Remover {{ nome }}"
                aria-label="Remover {{ nome }}"
                (click)="removerRascunho(nome)">
                <i class="fas fa-times" aria-hidden="true"></i>
              </button>
            </span>
          </div>
        </div>
        <p class="filter-empty-hint picker-selected-empty" *ngIf="!rascunhoLista.length">
          Nenhum médico selecionado. Busque e inclua abaixo.
        </p>

        <div
          class="filter-suggestions picker-list"
          *ngIf="temBusca && sugestoesParaIncluir.length; else medicoBuscaEstado">
          <div
            class="suggestion-item"
            *ngFor="let medico of sugestoesParaIncluir; trackBy: trackByMedicoOpcao">
            <span class="suggestion-nome" [title]="medico.nome">{{ medico.nome }}</span>
            <button
              type="button"
              class="medico-picker-btn medico-picker-btn-incluir"
              (click)="incluirMedico(medico.nome)">
              Incluir
            </button>
          </div>
        </div>
        <ng-template #medicoBuscaEstado>
          <span class="filter-empty-hint" *ngIf="!temBusca">
            Digite para buscar e incluir médicos
          </span>
          <span class="filter-empty-hint" *ngIf="temBusca && !sugestoesMedicoOrdenadas.length">
            Nenhum médico encontrado
          </span>
          <span
            class="filter-empty-hint"
            *ngIf="temBusca && sugestoesMedicoOrdenadas.length && !sugestoesParaIncluir.length">
            Todos os resultados já estão selecionados
          </span>
        </ng-template>
      </div>
      <footer class="picker-modal-footer">
        <button type="button" class="medico-picker-btn medico-picker-btn-cancel" (click)="fecharModal()">
          Cancelar
        </button>
        <button type="button" class="medico-picker-btn medico-picker-btn-confirm" (click)="confirmar()">
          <i class="fas fa-check" aria-hidden="true"></i>
          {{ confirmLabel }}
        </button>
      </footer>
    </section>
  </div>
</div>
