// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.1'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

// Gradle 10: plugins Capacitor leem ext do root via lookup implícito (deprecado).
// Copia as props para cada subprojeto antes da avaliação dos build.gradle.
gradle.beforeProject { project ->
    if (project == rootProject) {
        return
    }
    rootProject.ext.properties.each { key, value ->
        if (!project.ext.has(key)) {
            project.ext.set(key, value)
        }
    }
}

allprojects {
    tasks.withType(JavaCompile).configureEach {
        javaCompiler = javaToolchains.compilerFor {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
