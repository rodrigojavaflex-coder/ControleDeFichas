<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start" *ngIf="isNative">
      <ion-menu-button menu="main-menu"></ion-menu-button>
    </ion-buttons>
    <ion-title>Home</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="home-container" *ngIf="user">
    <div class="profile-card">
      <div class="profile-header">
        <div class="avatar">{{ user.nome.slice(0, 1) }}</div>
        <div class="profile-title">
          <h1>Olá, {{ user.nome }}</h1>
          <p>{{ user.email }}</p>
        </div>
      </div>

      <div class="profile-details">
        <div class="perfis-block">
          <span class="detail-label">Perfis</span>
          @if (profileNames.length === 0) {
            <span class="detail-value">Sem perfil</span>
          } @else {
            <div class="perfil-chips">
              @for (nome of profileNames; track $index) {
                <span class="perfil-chip">{{ nome }}</span>
              }
            </div>
          }
        </div>
        <div class="detail-row">
          <span class="detail-label">Status</span>
          <span class="detail-badge" [class.active]="userAtivo">
            {{ userAtivo ? 'Ativo' : 'Inativo' }}
          </span>
        </div>
      </div>
    </div>

  </div>
</ion-content>
